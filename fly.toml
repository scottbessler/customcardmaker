# fly.toml app configuration file generated for customcardmaker on 2026-11-26T21:52:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'customcardmaker'
primary_region = 'iad'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_PATH = '/data'
  PORT = '8080'

[processes]
  app = '/app/customcardmaker'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthcheck'
    protocol = 'http'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
